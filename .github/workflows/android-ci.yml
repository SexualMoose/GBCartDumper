name: Android CI

# Fleet Android CI (I-FW-005 / I-FW-027). This file is identical in every fleet Android repo except
# the `env:` block, so it can later be replaced by a ~10-line caller of one shared reusable workflow.

# Manual-only since 2026-10-20: builds and tests run locally (PETRICHOR; the Mac for iOS). Start it from the Actions tab.
on:
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # ---- per-repo settings: the only lines that differ between repos ----
  JAVA_VERSION: "21"
  GRADLE_TASKS: "assembleDebug testDebugUnitTest lintDebug"
  # Opt-in Compose accessibility checks (I-FW-027): "true" runs the app's a11y check tests.
  A11Y_CHECKS: "false"
  # ---------------------------------------------------------------------

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, unit tests, lint
        run: |
          chmod +x ./gradlew
          ./gradlew --stacktrace $GRADLE_TASKS -Pfleet.a11yChecks=$A11Y_CHECKS

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
